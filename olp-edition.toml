[public]
title = "ওপেন লজিক — বাংলা (ভারত): সংশোধিত সম্পূর্ণ সংস্করণ"
description = "ওপেন লজিক প্রকল্পের স্থির মূলের ৭২২টি বিষয়বস্তু-এককের ভারতীয় বাংলা সংস্করণ। ৮৯১-পৃষ্ঠার PDF, নেটিভ MathML-সহ HTML, পুনঃপ্রবাহযোগ্য EPUB, সম্মিলিত সম্পাদনযোগ্য LaTeX ও পূর্ণ উৎস ZIP পাওয়া যায়।"
limitations = ["পরিসর ৭২২টি বিষয়বস্তু-একক। স্বাধীন মানব-পর্যালোচনা বা সম্পূর্ণ প্রমাণ-সহায়ক যাচাই নথিভুক্ত নেই।", "GPT-6.1 Sol-এর প্রকাশিত সংশোধনে ৩৩৬টি প্রভাবিত একক মূলের সঙ্গে সম্পূর্ণ তুলনা করা হয়েছে। PDF-এর ২৭টি ও HTML-এর ২৩টি নির্বাচিত দৃশ্য পরীক্ষা করা হয়েছে।", "স্বজ্ঞাবাদী ট্যাবলোর স্থির উৎস নিজেই খসড়া। পূর্ণতা ও প্রতিমডেল নিষ্কাশনের অংশগুলি সেই উৎসে নেই।", "ক্যাননের উদ্ধৃতি মেলা ও পরিভাষার সমর্থন পৃথক। উদ্ধৃত NSOU পাঠ সসীম সেটের অঙ্কবাচক সংখ্যা সমর্থন করে। ট্রান্সফাইনাইট পরিভাষার সাক্ষ্য সীমিত।"]
attribution = "মূল রচনা ওপেন লজিক প্রকল্পের লেখক ও অবদানকারীদের। ভারতীয় বাংলা পাঠ OpenAI Codex-এর এআই অনুবাদ। পূর্ববর্তী অনুবাদ ও পর্যালোচনায় GPT-5.6 Sol ও GPT-6 Sol ব্যবহৃত হয়েছে। প্রকাশিত সংশোধন ও পুনঃপর্যালোচনায় GPT-6.1 Sol ব্যবহৃত হয়েছে। নথিভুক্ত প্রচেষ্টা-স্তর Ultra।"
license = "মূল পাঠ ও বাংলা অনুবাদ Creative Commons Attribution 4.0 International (CC BY 4.0)-এর অধীনে। পৃথক উপাদানের মূল লাইসেন্স অক্ষত। Noto ফন্ট SIL Open Font License 1.1-এর অধীনে। TX Fonts ও St Mary’s Road-এর গাণিতিক প্রতীকের নিজস্ব নোটিশ উৎস-সংগ্রহে আছে।"

